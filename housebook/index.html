      });
      if (chipsFor.length){
        sheet.appendChild(el("label", "fl", "Common for " + sys.category + " — tap to fill in"));
        var cw = el("div", "chips");
        chipsFor.forEach(function(c){
          var b = el("button", "chip", c.title + " · " + c.months + " mo" + (c.cond ? " — if you have one" : ""));
          b.addEventListener("click", function(){ openTaskEditor(sys, null, c); });
          cw.appendChild(b);
        });
        sheet.appendChild(cw);
      }
    }
    /* kind */
    sheet.appendChild(el("label", "fl", "Does it repeat?"));
    var kindSeg = el("div", "seg");
    var kindVal = t.kind;
    [["recurring","Repeats"],["oneoff","One time"]].forEach(function(kv){
      var c = el("button", "chip", kv[1]); c.setAttribute("aria-pressed", kindVal === kv[0] ? "true" : "false");
      c.addEventListener("click", function(){
        if (!isNew) return;
        kindVal = kv[0];
        kindSeg.querySelectorAll(".chip").forEach(function(n){ n.setAttribute("aria-pressed", "false"); });
        c.setAttribute("aria-pressed", "true");
        drawKindFields();
      });
      kindSeg.appendChild(c);
    });
    sheet.appendChild(kindSeg);
    var kindFields = el("div"); sheet.appendChild(kindFields);
    var intervalI, dateI, clockSeg, warnBox = el("div");
    var clockMode = "none"; /* lastdone | firstdue | none */
    function drawKindFields(){
      clear(kindFields);
      if (kindVal === "recurring"){
        kindFields.appendChild(el("label", "fl", "Every how many months? (blank = no schedule)"));
        intervalI = el("input"); intervalI.type = "number"; intervalI.min = "1"; intervalI.max = "120";
        intervalI.value = t.intervalMonths || ""; intervalI.setAttribute("inputmode", "numeric");
        kindFields.appendChild(intervalI);
        var quick = el("div", "chips");
        [1,3,6,12,24,36,60,84,120].forEach(function(n){
          var qc = el("button", "chip", n + " mo"); qc.style.minHeight = "44px";
          qc.addEventListener("click", function(){ intervalI.value = n; drawWarn(); });
          quick.appendChild(qc);
        });
        kindFields.appendChild(quick);
        if (isNew){
          kindFields.appendChild(el("label", "fl", "When does the clock start?"));
          clockSeg = el("div", "seg");
          [["lastdone","Last done: today"],["pickdate","Pick a date"],["firstdue","Set first due date"],["none","Don't know yet"]].forEach(function(cv){
            var c = el("button", "chip", cv[1]); c.setAttribute("aria-pressed", clockMode === cv[0] ? "true" : "false");
            c.addEventListener("click", function(){
              clockMode = cv[0];
              clockSeg.querySelectorAll(".chip").forEach(function(n){ n.setAttribute("aria-pressed", "false"); });
              c.setAttribute("aria-pressed", "true");
              dateWrap.style.display = (clockMode === "pickdate" || clockMode === "firstdue") ? "" : "none";
            });
            clockSeg.appendChild(c);
          });
          kindFields.appendChild(clockSeg);
          var dateWrap = el("div"); dateWrap.style.display = "none";
          dateI = el("input"); dateI.type = "date"; dateI.value = todayStr();
          dateWrap.appendChild(dateI); kindFields.appendChild(dateWrap);
        } else if (!lastDoneOn(t, APP.book.logEntries)){
          kindFields.appendChild(el("label", "fl", "First due date (optional)"));
          dateI = el("input"); dateI.type = "date"; dateI.value = t.firstDueOn || "";
          kindFields.appendChild(dateI);
        }
        if (t.anchorMonth) kindFields.appendChild(el("p", "note", "Anchored to a fixed date each cycle — logging it won't move next year's date."));
      } else {
        kindFields.appendChild(el("label", "fl", "Target date (optional — blank means the backlog)"));
        dateI = el("input"); dateI.type = "date"; dateI.value = t.targetOn || "";
        kindFields.appendChild(dateI);
      }
      kindFields.appendChild(warnBox);
      drawWarn();
    }
    function drawWarn(){
      clear(warnBox);
      if (tierVal === 1 && t.lifeMonths){
        var iv = intervalI ? parseInt(intervalI.value, 10) : t.intervalMonths;
        var spanHit = iv && iv > t.lifeMonths;
        var instHit = false;
        if (sys.installedOn && dateI && dateI.value && isValidDate(dateI.value)){
          instHit = dayDiff(sys.installedOn, dateI.value) > t.lifeMonths * 30.4375;
        }
        if (spanHit || instHit){
          var wb = el("div", "warnbox", "This device has a rated life of " + Math.round(t.lifeMonths/12) + " years. Past that span the sensor is not reliable — replacing it is the safer call. You can still save this; it's your house.");
          warnBox.appendChild(wb);
        }
      }
    }
    /* tier + booking */
    sheet.appendChild(el("label", "fl", "What happens if it's late?"));
    var tierSeg = el("div", "seg");
    var tierVal = t.tier;
    [[3,"Wear & tear"],[2,"Protects the house"],[1,"Safety"]].forEach(function(tv){
      var c = el("button", "chip", tv[1]); c.setAttribute("aria-pressed", tierVal === tv[0] ? "true" : "false");
      c.addEventListener("click", function(){
        tierVal = tv[0];
        tierSeg.querySelectorAll(".chip").forEach(function(n){ n.setAttribute("aria-pressed", "false"); });
        c.setAttribute("aria-pressed", "true");
        drawWarn();
      });
      tierSeg.appendChild(c);
    });
    sheet.appendChild(tierSeg);
    var bookChip = el("button", "chip", "Needs booking or parts");
    bookChip.setAttribute("aria-pressed", t.needsBooking ? "true" : "false");
    bookChip.style.marginTop = "10px";
    var bookVal = !!t.needsBooking;
    bookChip.addEventListener("click", function(){ bookVal = !bookVal; bookChip.setAttribute("aria-pressed", bookVal ? "true" : "false"); });
    sheet.appendChild(bookChip);
    sheet.appendChild(el("p", "note", "Booking/parts tasks turn amber earlier, so there's time to schedule."));
    drawKindFields();
    var save = el("button", "btn block", isNew ? "Add task" : "Save task"); save.style.marginTop = "18px";
    save.addEventListener("click", async function(){
      var title = titleI.value.trim();
      if (!title){ toast("Give the task a name first."); return; }
      t.title = title; t.kind = kindVal; t.tier = tierVal; t.needsBooking = bookVal; t.updatedAt = Date.now();
      /* Provenance: a SUGGESTED interval is promoted only by "Use this interval" or by
         changing the interval value (checked below, once the new interval is parsed).
         A no-change save — or a title/tier/booking edit — leaves it suggested. */
      var firstEntry = null;
      if (kindVal === "recurring"){
        var iv = intervalI && intervalI.value ? parseInt(intervalI.value, 10) : null;
        if (iv !== null && (!Number.isInteger(iv) || iv < 1 || iv > 120)){ toast("Interval must be 1–120 months."); return; }
        t.intervalMonths = iv;
        if (isNew && chip && iv !== chip.months) t.suggested = false; /* he changed the suggested interval — it's his now */
        if (!isNew && iv !== origInterval) t.suggested = false; /* same rule on edit: only an interval change promotes */
        if (isNew){
          if (clockMode === "lastdone" || clockMode === "pickdate"){
            var d = clockMode === "lastdone" ? todayStr() : (dateI.value || todayStr());
            if (!isValidDate(d)){ toast("That date isn't a real date."); return; }
            firstEntry = { id:uid(), systemId:sys.id, taskId:t.id, date:d, provider:"", costCents:null, note:"", createdAt:Date.now(), updatedAt:Date.now() };
            t.firstDueOn = null;
            if (chip && chip.anchored){
              var occ = addMonthsClamped(d, iv || 12), op = parseDate(occ);
              t.anchorMonth = op.m; t.anchorDay = op.d;
            }
          } else if (clockMode === "firstdue"){
            var fd = dateI.value;
            if (!fd || !isValidDate(fd)){ toast("Pick a first due date, or choose Don't know yet."); return; }
            t.firstDueOn = fd;
            if (chip && chip.anchored){ var fp = parseDate(fd); t.anchorMonth = fp.m; t.anchorDay = fp.d; }
          }
        } else if (dateI && !lastDoneOn(t, APP.book.logEntries)){
          t.firstDueOn = dateI.value && isValidDate(dateI.value) ? dateI.value : null;
        }
      } else {
        t.intervalMonths = null;
        t.targetOn = dateI && dateI.value && isValidDate(dateI.value) ? dateI.value : null;
      }
      await Store.tx(["tasks","logEntries"], "readwrite", async function(api){
        await api.put("tasks", t);
        if (firstEntry) await api.put("logEntries", firstEntry);
      });
      await maybePersist();
      closeSheet(); await loadBook(); render();
      toast(Store.mode === "memory" ? "Added for this visit only." : (isNew ? "Task added." : "Task saved."));
    });
    sheet.appendChild(save);
    if (!isNew){
      var del = el("button", "btn danger block", "Delete this task"); del.style.marginTop = "20px";
      del.addEventListener("click", function(){
        confirmSheet("Delete this task?", "The schedule goes away. Its service history stays in the log — the book keeps what was done.", "Delete task", true, async function(){
          await Store.tx(["tasks","logEntries"], "readwrite", async function(api){
            var ens = await api.getAllByIndex("logEntries", "by_task", t.id);
            for (var i = 0; i < ens.length; i++){ ens[i].taskId = null; await api.put("logEntries", ens[i]); }
            await api.del("tasks", t.id);
          });
          await loadBook(); render(); toast("Task deleted. Its history stays in the log.");
        });
      });
      sheet.appendChild(del);
    }
  });
}

function openLogSheet(task, sys){
  openSheet(function(sheet){
    var today = todayStr();
    sheet.appendChild(el("h2", null, task ? "Log it" : "Log a service"));
    if (task) sheet.appendChild(el("p", "prose", task.title + " · " + sys.name));
    sheet.appendChild(el("label", "fl", "Date"));
    var dateI = el("input"); dateI.type = "date"; dateI.value = today; sheet.appendChild(dateI);
    var taskSel = null;
    if (!task){
      sheet.appendChild(el("label", "fl", "For which task? (optional)"));
      taskSel = el("select");
      var none = el("option", null, "No task — just history"); none.value = ""; taskSel.appendChild(none);
      APP.book.tasks.filter(function(x){ return x.systemId === sys.id && !x.doneOn; }).forEach(function(x){
        var o = el("option", null, x.title); o.value = x.id; taskSel.appendChild(o);
      });
      sheet.appendChild(taskSel);
      sheet.appendChild(el("label", "fl", "Who did it (optional)"));
      var provI = el("input"); provI.type = "text"; sheet.appendChild(provI);
      sheet.appendChild(el("label", "fl", "Cost (optional)"));
      var costI = el("input"); costI.type = "text"; costI.setAttribute("inputmode", "decimal"); costI.placeholder = "$"; sheet.appendChild(costI);
      sheet.appendChild(el("label", "fl", "Note (optional)"));
      var noteI = el("textarea"); sheet.appendChild(noteI);
      var saveG = el("button", "btn block", "Log service"); saveG.style.marginTop = "16px";
      saveG.addEventListener("click", async function(){
        if (saveG.disabled) return; saveG.disabled = true;
        var cost = null;
        var raw = costI.value.replace(/[$,]/g, "").trim();
        if (raw){ var f = parseFloat(raw); if (!isNaN(f) && f >= 0) cost = Math.round(f*100); }
        var entry = { id:uid(), systemId:sys.id, taskId:taskSel.value || null,
          date: isValidDate(dateI.value) ? dateI.value : today,
          provider:provI.value.trim(), costCents:cost, note:noteI.value, createdAt:Date.now(), updatedAt:Date.now() };
        var doneTask = null;
        if (entry.taskId){
          var lt = APP.book.tasks.find(function(x){ return x.id === entry.taskId; });
          if (lt && lt.kind === "oneoff" && !lt.doneOn) doneTask = lt;
        }
        await Store.tx(["logEntries","tasks"], "readwrite", async function(api){
          await api.put("logEntries", entry);
          if (doneTask){ doneTask.doneOn = entry.date; doneTask.updatedAt = Date.now(); await api.put("tasks", doneTask); }
        });
        await maybePersist();
        closeSheet(); await loadBook(); render(); toast("Logged.");
      });
      sheet.appendChild(saveG);
      sheet._provI = provI; sheet._costI = costI; sheet._noteI = noteI;
      return;
    }
    /* task path: 2 taps — pre-filled sheet, one Log it */
    var others = APP.book.tasks.filter(function(x){ return x.systemId === sys.id && x.id !== task.id && x.kind === "recurring"; });
    var checks = [];
    if (others.length){
      sheet.appendChild(el("label", "fl", "Also done on this visit? (only if it really was)"));
      others.forEach(function(o){
        var row = el("label", "checkrow");
        var cb = el("input"); cb.type = "checkbox";
        row.appendChild(cb); row.appendChild(el("span", null, o.title));
        sheet.appendChild(row);
        checks.push({ task:o, cb:cb });
      });
    }
    var save = el("button", "btn block", "Log it"); save.style.marginTop = "16px";
    save.addEventListener("click", async function(){
      if (save.disabled) return; save.disabled = true;
      var d = isValidDate(dateI.value) ? dateI.value : today;
      var ticked = checks.filter(function(c){ return c.cb.checked; }).map(function(c){ return c.task; });
      await Store.tx(["logEntries","tasks"], "readwrite", async function(api){
        var main = { id:uid(), systemId:sys.id, taskId:task.id, date:d, provider:"", costCents:null, note:"", createdAt:Date.now(), updatedAt:Date.now() };
        await api.put("logEntries", main);
        for (var i = 0; i < ticked.length; i++){
          await api.put("logEntries", { id:uid(), systemId:sys.id, taskId:ticked[i].id, date:d, provider:"", costCents:null, note:"", createdAt:Date.now(), updatedAt:Date.now() });
        }
        if (task.kind === "oneoff" && !task.doneOn){
          task.doneOn = d; task.updatedAt = Date.now();
          await api.put("tasks", task);
        }
      });
      await maybePersist();
      await loadBook();
      if (task.kind === "oneoff"){
        clear(sheet);
        sheet.appendChild(el("h2", null, "Done — it's in the log"));
        sheet.appendChild(el("p", "prose", "Want to keep track of this? Both are optional, neither is set up until you tap."));
        var rep = el("button", "btn block", "Make this repeat");
        rep.addEventListener("click", function(){
          var copy = { id:uid(), systemId:sys.id, title:task.title, kind:"recurring", intervalMonths:null, firstDueOn:null,
            targetOn:null, tier:task.tier, needsBooking:task.needsBooking, suggested:false, anchorMonth:null, anchorDay:null,
            doneOn:null, lifeMonths:task.lifeMonths || null, createdAt:Date.now(), updatedAt:Date.now() };
          closeSheet(); openTaskEditor(sys, copy, null, true);
        });
        sheet.appendChild(rep);
        sheet.appendChild(el("label", "fl", "Or check on it in a few months"));
        var seg = el("div", "seg"); var months = 6;
        [3,6,12].forEach(function(n){
          var c = el("button", "chip", n + " months"); c.setAttribute("aria-pressed", n === 6 ? "true" : "false");
          c.addEventListener("click", function(){ months = n; seg.querySelectorAll(".chip").forEach(function(x){ x.setAttribute("aria-pressed", "false"); }); c.setAttribute("aria-pressed", "true"); });
          seg.appendChild(c);
        });
        sheet.appendChild(seg);
        var chk = el("button", "btn ghost block", "Set the check-in");
        chk.style.marginTop = "10px";
        chk.addEventListener("click", async function(){
          var follow = { id:uid(), systemId:sys.id, title:"Check: " + task.title, kind:"oneoff", intervalMonths:null,
            firstDueOn:null, targetOn:addMonthsClamped(d, months), tier:task.tier, needsBooking:false, suggested:false,
            anchorMonth:null, anchorDay:null, doneOn:null, lifeMonths:null, createdAt:Date.now(), updatedAt:Date.now() };
          await Store.tx(["tasks"], "readwrite", function(api){ return api.put("tasks", follow); });
          closeSheet(); await loadBook(); render(); toast("Check-in set.");
        });
        sheet.appendChild(chk);
        var no = el("button", "btn ghost block", "No, just the log entry");
        no.style.marginTop = "8px";
        no.addEventListener("click", function(){ closeSheet(); render(); });
        sheet.appendChild(no);
        render();
        return;
      }
      closeSheet(); render(); toast("Logged.");
    });
    sheet.appendChild(save);
  });
}

function openEntryEditor(sys, entry){
  openSheet(async function(sheet){
    sheet.appendChild(el("h2", null, "Service entry"));
    sheet.appendChild(el("label", "fl", "Date"));
    var dateI = el("input"); dateI.type = "date"; dateI.value = entry.date; sheet.appendChild(dateI);
    if (entry.date === todayStr()){
      var y = el("button", "btn ghost small", "Actually yesterday");
      y.style.marginTop = "8px";
      y.addEventListener("click", function(){ dateI.value = addDays(todayStr(), -1); });
      sheet.appendChild(y);
    }
    sheet.appendChild(el("label", "fl", "Who did it"));
    var provI = el("input"); provI.type = "text"; provI.value = entry.provider || ""; sheet.appendChild(provI);
    sheet.appendChild(el("label", "fl", "Cost"));
    var costI = el("input"); costI.type = "text"; costI.setAttribute("inputmode", "decimal");
    costI.value = entry.costCents !== null && entry.costCents !== undefined ? (entry.costCents/100).toString() : "";
    sheet.appendChild(costI);
    sheet.appendChild(el("label", "fl", "Note — mileage, parts, what they said"));
    var noteI = el("textarea"); noteI.value = entry.note || ""; sheet.appendChild(noteI);
    var photos = await photosOf("logEntry", entry.id);
    if (photos.length){
      var strip = el("div", "photostrip");
      photos.forEach(function(p){
        var fig = el("figure");
        if (p.blob){ var im = el("img"); im.src = objURL(p.blob); im.alt = p.kind + " photo"; fig.appendChild(im); }
        fig.appendChild(el("figcaption", null, p.kind));
        strip.appendChild(fig);
      });
      sheet.appendChild(strip);
    }
    var addP = el("button", "btn ghost small", "Add a photo (invoice, receipt)");
    addP.addEventListener("click", function(){ openAddPhoto(sys, entry); });
    sheet.appendChild(addP);
    var save = el("button", "btn block", "Save entry"); save.style.marginTop = "16px";
    save.addEventListener("click", async function(){
      var raw = costI.value.replace(/[$,]/g, "").trim();
      var cost = null;
      if (raw){ var f = parseFloat(raw); if (!isNaN(f) && f >= 0) cost = Math.round(f*100); }
      entry.date = isValidDate(dateI.value) ? dateI.value : entry.date;
      entry.provider = provI.value.trim(); entry.costCents = cost; entry.note = noteI.value;
      entry.updatedAt = Date.now();
      await Store.tx(["logEntries"], "readwrite", function(api){ return api.put("logEntries", entry); });
      closeSheet(); await loadBook(); render(); toast("Entry saved.");
    });
    sheet.appendChild(save);
    var del = el("button", "btn danger block", "Delete this entry"); del.style.marginTop = "20px";
    del.addEventListener("click", function(){
      confirmSheet("Delete this entry?", "The entry and its photos are removed. If it was a task's latest service, that task's next due date moves back to the service before it.", "Delete entry", true, async function(){
        await Store.tx(["logEntries","photos"], "readwrite", async function(api){
          var phs = await api.getAllByIndex("photos", "by_owner", ["logEntry", entry.id]);
          for (var i = 0; i < phs.length; i++) await api.del("photos", phs[i].id);
          await api.del("logEntries", entry.id);
        });
        await loadBook(); render(); toast("Entry deleted.");
      });
    });
    sheet.appendChild(del);
  });
}
</script>
<script>
"use strict";
/* ============================================================
   Script 6: settings, export/import, erase, boot.
   ============================================================ */
function fmtBytes(n){
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}
async function renderSettings(){
  var view = clear(document.getElementById("view-settings"));
  var book = APP.book;
  var photoBytes = 0;
  var photos = await Store.readAll("photos");
  photos.forEach(function(p){ photoBytes += p.bytes || 0; });
  var h = el("h2", null, "About this book"); h.style.fontFamily = "var(--serif)"; h.style.fontSize = "24px";
  view.appendChild(h);
  var counts = el("div"); counts.style.marginTop = "8px";
  function kv(k, v){ var row = el("div", "kv"); row.appendChild(el("span", "k", k)); row.appendChild(el("span", "v", v)); counts.appendChild(row); }
  kv("Systems", String(book.systems.length));
  kv("Tasks", String(book.tasks.length));
  kv("Log entries", String(book.logEntries.length));
  kv("Photos", String(photos.length) + " (" + fmtBytes(photoBytes) + ")");
  view.appendChild(counts);
  var estSpan = el("p", "note", "");
  view.appendChild(estSpan);
  if (navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(function(est){
      if (est && est.usage !== undefined) estSpan.textContent = "The browser estimates this site is using about " + fmtBytes(est.usage) + " on this device. That's an estimate, not a meter.";
    }).catch(function(){});
  }
  var persistLine = el("p", "note", "");
  if (Store.mode === "memory"){
    persistLine.textContent = "This browser isn't keeping saves between visits — the book lives only while this page is open.";
  } else if (navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted().then(function(p){
      persistLine.textContent = p
        ? "Long-term keeping: on. This browser keeps the book on this device."
        : "The book is saved on this device for now. A browser can still clear site data — the export below is the real safety net.";
    }).catch(function(){ persistLine.textContent = ""; });
  }
  view.appendChild(persistLine);
  if (book.meta.lastExportAt){
    view.appendChild(el("p", "note", "Last exported: " + prettyDate(book.meta.lastExportAt.slice(0,10)) + "."));
  } else if (photos.length || book.systems.length){
    view.appendChild(el("p", "note", "No backup exported yet."));
  }
  /* export */
  view.appendChild(el("div", "lanelabel", "Backup"));
  view.appendChild(el("p", "prose", "This file contains your whole book, unencrypted. Store it like house keys."));
  var exp = el("button", "btn block", "Export backup file");
  exp.addEventListener("click", function(){ doExport(); });
  view.appendChild(exp);
  var imp = el("button", "btn ghost block", "Restore from a backup file");
  imp.style.marginTop = "10px";
  imp.addEventListener("click", function(){ document.getElementById("fileImport").click(); });
  view.appendChild(imp);
  /* about */
  view.appendChild(el("div", "lanelabel", "About HouseBook"));
  view.appendChild(el("p", "prose", "HouseBook lives only in this browser, on this device. There is no account, no server, and no notifications — the radar updates when you open it. If this browser's data is cleared, the book is gone unless you exported a backup. The backup file isn't encrypted: anyone who opens it can read everything in it. There's no lock on the book, so anyone using this device and browser can open it. And HouseBook only knows what you tell it — a task you never add can't come due, and a date you never log can't be counted."));
  /* erase */
  view.appendChild(el("div", "lanelabel", "Start over"));
  var erase = el("button", "btn danger block", "Erase this book");
  erase.addEventListener("click", function(){
    confirmSheet("Erase this book?", "Every system, task, log entry, and photo in this book is deleted from this device. Export a backup first if you might want any of it back.", "Keep going", true, function(){
      confirmSheet("Really erase everything?", "This is the last step. There's no undo and no copy anywhere else.", "Erase everything", true, async function(){
        await Store.tx(["systems","tasks","logEntries","photos","meta"], "readwrite", async function(api){
          await api.clear("systems"); await api.clear("tasks"); await api.clear("logEntries"); await api.clear("photos"); await api.clear("meta");
          await api.put("meta", { key:"bookId", value:uid() });
          await api.put("meta", { key:"schemaVersion", value:1 });
          await api.put("meta", { key:"createdAt", value:Date.now() });
        });
        await loadBook(); show("radar"); toast("Book erased.");
      });
    });
  });
  view.appendChild(erase);
}
async function doExport(){
  try {
    var photos = await Store.readAll("photos");
    var backup = await buildBackup(APP.book, photos);
    var json = JSON.stringify(backup);
    var blob = new Blob([json], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = el("a"); a.href = url; a.download = "housebook-backup-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    var now = new Date().toISOString();
    await metaPut("lastExportAt", now);
    APP.book.meta.lastExportAt = now;
    render();
    toast("Backup exported. Store it like house keys.");
  } catch(e){
    openSheet(function(sheet){
      sheet.appendChild(el("h2", null, "Export didn't finish"));
      sheet.appendChild(el("p", "prose", e.code === "BACKUP_TOO_LARGE"
        ? "This book is too big to export as one file. Nothing was changed. Delete photos you don't need and try again."
        : "A photo in this book couldn't be read, so the export stopped rather than leave it out silently. Nothing was changed. You can delete that photo from its system page and export again."));
      var ok = el("button", "btn block", "Back"); ok.addEventListener("click", closeSheet); sheet.appendChild(ok);
    });
  }
}
function importErrorSheet(messages){
  openSheet(function(sheet){
    sheet.appendChild(el("h2", null, "That file can't be restored"));
    sheet.appendChild(el("p", "prose", "Nothing was imported and your book is unchanged."));
    messages.slice(0, 5).forEach(function(m){ sheet.appendChild(el("p", "note", m)); });
    var ok = el("button", "btn block", "Back"); ok.addEventListener("click", closeSheet); sheet.appendChild(ok);
  });
}
async function handleImportFile(file){
  if (!file) return;
  if (file.size > 262144000){ importErrorSheet(["That file is larger than HouseBook accepts."]); return; }
  var text;
  try { text = await file.text(); } catch(e){ importErrorSheet(["The file couldn't be read."]); return; }
  var obj;
  try { obj = JSON.parse(text); } catch(e){ importErrorSheet(["That file isn't a HouseBook backup."]); return; }
  var today = todayStr();
  var extra = { systems:{}, tasks:{}, logEntries:{} };
  APP.book.systems.forEach(function(s){ extra.systems[s.id] = true; });
  APP.book.tasks.forEach(function(t){ extra.tasks[t.id] = t.systemId; });
  APP.book.logEntries.forEach(function(en){ extra.logEntries[en.id] = true; });
  var strict = validateBackup(obj, today);
  var union = strict.ok ? strict : validateBackup(obj, today, extra);
  if (!union.ok){ importErrorSheet(union.errors); return; }
  var different = obj.bookId && APP.book.meta.bookId && obj.bookId !== APP.book.meta.bookId;
  openSheet(function(sheet){
    sheet.appendChild(el("h2", null, "Restore this backup?"));
    var expDate = obj.exportedAt ? prettyDate(String(obj.exportedAt).slice(0,10)) : "unknown date";
    sheet.appendChild(el("p", "prose", "Exported " + expDate + " · " + obj.systems.length + " systems, " + obj.tasks.length + " tasks, " + obj.logEntries.length + " log entries, " + obj.photos.length + " photos."));
    if (different) sheet.appendChild(el("p", "prose", "This file is a different book than the one on this device."));
    var mode = strict.ok ? "replace" : "merge";
    var seg = el("div", "seg");
    var repB = el("button", "chip", "Replace this book"); repB.setAttribute("aria-pressed", mode === "replace" ? "true" : "false");
    var merB = el("button", "chip", "Merge (add what's new)"); merB.setAttribute("aria-pressed", mode === "merge" ? "true" : "false");
    if (!strict.ok){ repB.disabled = true; repB.style.opacity = ".45"; }
    repB.addEventListener("click", function(){ mode = "replace"; repB.setAttribute("aria-pressed", "true"); merB.setAttribute("aria-pressed", "false"); drawAck(); });
    merB.addEventListener("click", function(){ mode = "merge"; merB.setAttribute("aria-pressed", "true"); repB.setAttribute("aria-pressed", "false"); drawAck(); });
    seg.appendChild(repB); seg.appendChild(merB); sheet.appendChild(seg);
    sheet.appendChild(el("p", "note", "Replace deletes the book on this device and writes this file in its place. Merge adds only records that aren't already here — it never overwrites."));
    var ackWrap = el("div"); sheet.appendChild(ackWrap);
    var ackChecked = false;
    function drawAck(){
      clear(ackWrap); ackChecked = false;
      if (mode === "replace" && obj.systems.length === 0 && APP.book.systems.length > 0){
        var row = el("label", "checkrow");
        var cb = el("input"); cb.type = "checkbox";
        cb.addEventListener("change", function(){ ackChecked = cb.checked; confirm.disabled = !ackChecked; });
        row.appendChild(cb);
        row.appendChild(el("span", null, "This file is an empty book. Replacing will erase the book on this device — I understand."));
        ackWrap.appendChild(row);
        confirm.disabled = true;
      } else { confirm.disabled = false; }
    }
    var confirm = el("button", "btn block", "Restore"); confirm.style.marginTop = "14px";
    confirm.addEventListener("click", async function(){
      if (confirm.disabled) return; confirm.disabled = true;
      try { await applyImport(obj, mode, extra); }
      catch(e){ importErrorSheet(["The restore failed partway. " + (mode === "replace" ? "Your book may be incomplete — restore again from the file." : "Try the restore again.")]); return; }
      closeSheet(); await loadBook(); show("radar");
    });
    sheet.appendChild(confirm);
    drawAck();
    var cancel = el("button", "btn ghost block", "Cancel"); cancel.style.marginTop = "8px";
    cancel.addEventListener("click", closeSheet); sheet.appendChild(cancel);
  });
}
async function decodePhotos(list){
  return list.map(function(p){
    var bytes = base64ToBytes(p.dataBase64);
    return { id:p.id, ownerType:p.ownerType, ownerId:p.ownerId, kind:p.kind, blob:new Blob([bytes], { type:"image/jpeg" }),
      mime:p.mime, width:p.width, height:p.height, bytes:p.bytes, caption:p.caption || "", sortOrder:p.sortOrder || 0, createdAt:p.createdAt || Date.now() };
  });
}
async function applyImport(obj, mode, extra){
  var photoRecs = await decodePhotos(obj.photos);
  if (mode === "replace"){
    await Store.tx(["systems","tasks","logEntries","photos","meta"], "readwrite", async function(api){
      await api.clear("systems"); await api.clear("tasks"); await api.clear("logEntries"); await api.clear("photos"); await api.clear("meta");
      var i;
      for (i = 0; i < obj.systems.length; i++) await api.put("systems", obj.systems[i]);
      for (i = 0; i < obj.tasks.length; i++) await api.put("tasks", obj.tasks[i]);
      for (i = 0; i < obj.logEntries.length; i++) await api.put("logEntries", obj.logEntries[i]);
      for (i = 0; i < photoRecs.length; i++) await api.put("photos", photoRecs[i]);
      await api.put("meta", { key:"bookId", value: obj.bookId || uid() });
      await api.put("meta", { key:"schemaVersion", value: 1 });
      await api.put("meta", { key:"createdAt", value: obj.createdAt || Date.now() });
      if (obj.exportedAt) await api.put("meta", { key:"lastExportAt", value: obj.exportedAt });
      if (APP.book.meta.persistRequestedAt) await api.put("meta", { key:"persistRequestedAt", value: APP.book.meta.persistRequestedAt });
    });
    toast("Book restored from backup.");
  } else {
    var added = { systems:0, tasks:0, logEntries:0, photos:0 }, skipped = 0;
    await Store.tx(["systems","tasks","logEntries","photos"], "readwrite", async function(api){
      var i, ex;
      for (i = 0; i < obj.systems.length; i++){ ex = await api.get("systems", obj.systems[i].id); if (ex) skipped++; else { await api.put("systems", obj.systems[i]); added.systems++; } }
      for (i = 0; i < obj.tasks.length; i++){ ex = await api.get("tasks", obj.tasks[i].id); if (ex) skipped++; else { await api.put("tasks", obj.tasks[i]); added.tasks++; } }
      for (i = 0; i < obj.logEntries.length; i++){ ex = await api.get("logEntries", obj.logEntries[i].id); if (ex) skipped++; else { await api.put("logEntries", obj.logEntries[i]); added.logEntries++; } }
      for (i = 0; i < photoRecs.length; i++){ ex = await api.get("photos", photoRecs[i].id); if (ex) skipped++; else { await api.put("photos", photoRecs[i]); added.photos++; } }
    });
    toast("Merged: added " + added.systems + " systems, " + added.tasks + " tasks, " + added.logEntries + " entries, " + added.photos + " photos. " + skipped + " already here, skipped.");
  }
  await maybePersist();
}
/* import file wiring */
document.getElementById("fileImport").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  handleImportFile(f);
});
/* boot */
(async function boot(){
  await Store.open();
  if (Store.mode === "memory"){
    var banner = document.getElementById("saveBanner");
    banner.textContent = "This book can't save on this device. Anything you add will be gone when this page closes. Export a backup before you close it if you want to keep it.";
    banner.hidden = false;
  }
  await loadBook();
  await ensureBookMeta();
  show("radar");
})();
/* harness surface */
window.HB = {
  dates: { parseDate:parseDate, isValidDate:isValidDate, addMonthsClamped:addMonthsClamped, dayDiff:dayDiff, addDays:addDays, todayStr:todayStr },
  derive: { lastDoneOn:lastDoneOn, nextDueOn:nextDueOn, taskStatus:taskStatus, amberDaysFor:amberDaysFor, radarModel:radarModel, dueText:dueText },
  store: Store, state: function(){ return APP; }, loadBook: loadBook,
  buildBackup: buildBackup, validateBackup: validateBackup, processPhoto: processPhoto
};
</script>
