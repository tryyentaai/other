<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151d">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Outfitter — your closet, dealt</title>
<meta name="description" content="Photograph your clothes once. Tap an occasion, get dressed. Fully on-device.">
<script>
/* First-paint theme: dark by default (a dim bedroom is the primary context).
   A saved "match phone" choice is mirrored to localStorage so the first
   paint can honor it without waiting on IndexedDB. Theme is a display
   preference string only — no tokens or data live in localStorage. */
try {
  var t = localStorage.getItem('outfitter-theme');
  if (t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
} catch (e) {}
</script>
<style>
/* ============ Tokens: primitives -> semantic -> component ============ */
:root{
  --ink-950:#0b0f16; --ink-900:#10151d; --ink-800:#171e29; --ink-700:#212b3a;
  --bone-50:#f6f1e7; --bone-100:#ece5d8; --bone-300:#cfc4ae; --bone-500:#9a8f7a;
  --cognac-400:#cd9464; --cognac-500:#c08552; --cognac-600:#a56f3f;
  --red-400:#e07856; --green-400:#7fb069;
  --bg:var(--ink-900); --bg-deep:var(--ink-950);
  --surface:var(--ink-800); --surface-2:var(--ink-700);
  --text:var(--bone-100); --text-dim:var(--bone-300); --text-faint:var(--bone-500);
  --accent:var(--cognac-400); --accent-strong:var(--cognac-500);
  --line:rgba(236,229,216,.14); --line-strong:rgba(236,229,216,.28);
  --danger:var(--red-400); --ok:var(--green-400);
  --photo-back:#232d3d;
  --dock-bg:rgba(16,21,29,.92);
  --btn-primary-bg:var(--cognac-500); --btn-primary-text:#14100b;
  --chip-bg:var(--ink-700); --chip-on-bg:var(--cognac-500); --chip-on-text:#14100b;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  --bg:#f2ecdf; --bg-deep:#e9e1cf;
  --surface:#faf6ec; --surface-2:#efe7d5;
  --text:#1d2531; --text-dim:#4c463a; --text-faint:#7d7462;
  --accent:#a56f3f; --accent-strong:#8f5f33;
  --line:rgba(29,37,49,.14); --line-strong:rgba(29,37,49,.3);
  --photo-back:#ddd2ba;
  --dock-bg:rgba(242,236,223,.94);
  --btn-primary-bg:#a56f3f; --btn-primary-text:#fff8ec;
  --chip-bg:#e7ddc8; --chip-on-bg:#a56f3f; --chip-on-text:#fff8ec;
  --shadow:0 10px 30px rgba(60,45,20,.18);
}
/* ============ Base ============ */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--text);
  font:17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
  min-height:100svh;
}
h1,h2,h3{font-family:Georgia, "Times New Roman", ui-serif, serif; font-weight:600; margin:0}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; padding:0}
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:8px}
img{display:block}
svg.ic{width:24px; height:24px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
svg.ic.fill{fill:currentColor; stroke:none}
main{max-width:560px; margin:0 auto; padding:18px 16px 8px}
/* ============ Header ============ */
header.app{max-width:560px; margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 16px 4px; display:flex; align-items:baseline; justify-content:space-between}
.wordmark{font-family:Georgia, "Times New Roman", ui-serif, serif; font-size:26px; letter-spacing:.14em; text-transform:uppercase}
.wordmark small{display:block; font-family:inherit; font-size:11px; letter-spacing:.22em; color:var(--text-faint); text-transform:uppercase; margin-top:2px}
/* ============ Banner ============ */
.banner{display:none; margin:12px 16px 0; max-width:528px; margin-left:auto; margin-right:auto; background:var(--surface); border:1px solid var(--danger); border-radius:14px; padding:12px 14px; font-size:15px}
.banner.show{display:block}
.banner strong{color:var(--danger)}
/* ============ Views ============ */
.view{display:none}
.view.active{display:block}
/* ============ Empty state ============ */
.empty{padding:9svh 8px 0; text-align:left}
.empty h1{font-size:34px; line-height:1.15; margin-bottom:12px}
.empty p{font-size:19px; color:var(--text-dim); margin:0 0 10px; max-width:34ch}
.empty .cap{font-size:15px; color:var(--text-faint)}
/* ============ Buttons ============ */
.btn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:56px; border-radius:16px; background:var(--surface-2); color:var(--text); font-weight:600; font-size:17px; padding:12px 18px; border:1px solid var(--line)}
.btn.primary{background:var(--btn-primary-bg); color:var(--btn-primary-text); border-color:transparent; min-height:64px; font-size:19px}
.btn.quiet{background:transparent; border-color:transparent; color:var(--text-dim); font-weight:500}
.btn.danger-outline{border-color:var(--danger); color:var(--danger); background:transparent}
.btn:disabled{opacity:.45; cursor:default}
.btn-row{display:flex; gap:10px}
.btn-row .btn{flex:1}
.link-btn{color:var(--accent); font-weight:600; text-decoration:underline; text-underline-offset:3px; min-height:44px; display:inline-flex; align-items:center}
/* ============ Occasion chips ============ */
.occ-row{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0 16px}
.occ{min-height:56px; border-radius:16px; background:var(--chip-bg); border:1px solid var(--line); font-weight:600; font-size:17px; display:flex; align-items:center; justify-content:center; padding:10px}
.occ[aria-pressed="true"]{background:var(--chip-on-bg); color:var(--chip-on-text); border-color:transparent}
/* ============ Outfit card ============ */
.outfit{background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden; box-shadow:var(--shadow)}
.outfit .slot{position:relative; border-bottom:1px solid var(--line); background:var(--photo-back); cursor:pointer}
.outfit .slot:last-of-type{border-bottom:none}
.outfit .slot img{width:100%; height:172px; object-fit:cover}
.outfit .slot .tag{position:absolute; left:12px; bottom:10px; background:rgba(10,13,18,.72); color:#f2ecdf; font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:5px 10px; border-radius:999px}
.outfit .slot .guess{position:absolute; right:12px; bottom:10px; background:rgba(10,13,18,.72); color:#f0c98f; font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px}
.rate-row{display:flex; border-top:1px solid var(--line)}
.rate-row button{flex:1; min-height:58px; display:flex; align-items:center; justify-content:center; gap:9px; font-weight:600; font-size:16px}
.rate-row button + button{border-left:1px solid var(--line)}
.rate-row .loved-on{color:var(--ok)}
.card-note{padding:12px 16px; font-size:14.5px; color:var(--text-dim); border-top:1px solid var(--line)}
.morning-actions{margin-top:14px; display:grid; gap:10px}
.deal-state{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:22px 18px}
.deal-state h2{font-size:23px; margin-bottom:8px}
.deal-state p{color:var(--text-dim); margin:0 0 6px}
.deal-state .btn{margin-top:12px}
.done-note{text-align:center; padding:8svh 12px 0}
.done-note h2{font-size:27px; margin-bottom:10px}
.done-note p{color:var(--text-dim)}
/* ============ Closet ============ */
.cap-line{color:var(--text-dim); font-size:15.5px; margin:2px 0 14px}
.strip{background:var(--surface); border:1px solid var(--accent); border-radius:16px; padding:12px 14px; margin-bottom:14px}
.strip h3{font-size:17px; margin-bottom:4px}
.strip p{margin:0; color:var(--text-dim); font-size:14.5px}
.strip .btn{margin-top:10px; min-height:48px}
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fchip{flex:none; min-height:44px; padding:8px 16px; border-radius:999px; background:var(--chip-bg); border:1px solid var(--line); font-weight:600; font-size:15px}
.fchip[aria-pressed="true"]{background:var(--chip-on-bg); color:var(--chip-on-text); border-color:transparent}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.cell{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; position:relative; text-align:left; width:100%}
.cell img{width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--photo-back)}
.cell .cap{padding:9px 11px 11px; font-size:14.5px; font-weight:600; line-height:1.3}
.cell .sub{padding:0 11px 10px; margin-top:-6px; font-size:12.5px; color:var(--text-faint); font-weight:500}
.cell .badge{position:absolute; top:8px; left:8px; background:rgba(10,13,18,.75); color:#f0c98f; font-size:11.5px; font-weight:700; padding:4px 8px; border-radius:999px}
.cell .badge.wash{color:#bcd7f0}
.cell.retired{opacity:.45}
.cell .retire-btn{position:absolute; top:6px; right:6px; width:44px; height:44px; display:flex; align-items:center; justify-content:center; background:rgba(10,13,18,.55); border-radius:12px; color:#f2ecdf}
/* ============ Dock ============ */
nav.dock{position:fixed; left:0; right:0; bottom:0; background:var(--dock-bg); backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); z-index:40}
nav.dock .inner{max-width:560px; margin:0 auto; display:flex; gap:6px; align-items:stretch}
nav.dock button{flex:1; min-height:56px; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:12.5px; font-weight:600; color:var(--text-dim)}
nav.dock button[aria-current="page"]{color:var(--accent); background:var(--surface)}
nav.dock button.add{color:var(--btn-primary-text); background:var(--btn-primary-bg); flex:1.25; font-size:13.5px}
/* ============ Sheets ============ */
.sheet-wrap{position:fixed; inset:0; background:rgba(5,7,10,.62); display:none; z-index:60; align-items:flex-end; justify-content:center}
.sheet-wrap.show{display:flex}
.sheet{background:var(--bg); width:100%; max-width:560px; max-height:92svh; overflow-y:auto; border-radius:24px 24px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom)); box-shadow:var(--shadow)}
.sheet h2{font-size:23px; margin-bottom:6px}
.sheet .lede{color:var(--text-dim); margin:0 0 14px; font-size:15.5px}
.sheet .photo-large{width:100%; aspect-ratio:4/5; object-fit:cover; border-radius:16px; background:var(--photo-back); margin-bottom:14px}
.field{margin:16px 0}
.field > span{display:block; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:8px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{min-height:44px; padding:9px 15px; border-radius:999px; background:var(--chip-bg); border:1px solid var(--line); font-weight:600; font-size:15px}
.chip[aria-pressed="true"]{background:var(--chip-on-bg); color:var(--chip-on-text); border-color:transparent}
input[type="text"], select{width:100%; min-height:52px; border-radius:12px; border:1px solid var(--line-strong); background:var(--surface); color:var(--text); font:inherit; padding:10px 12px}
.toggle-row{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 2px; border-bottom:1px solid var(--line)}
.toggle-row .lbl{font-weight:600}
.toggle-row .hint{font-size:13.5px; color:var(--text-faint); font-weight:400}
.switch{width:58px; height:34px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line-strong); position:relative; flex:none}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:var(--bone-100); transition:left .15s ease}
.switch[aria-checked="true"]{background:var(--accent-strong)}
.switch[aria-checked="true"]::after{left:27px}
/* ============ Add flow ============ */
.addflow{position:fixed; inset:0; background:var(--bg); z-index:50; display:none; overflow-y:auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.addflow.show{display:block}
.addflow .inner{max-width:560px; margin:0 auto}
.addflow h2{font-size:25px; margin-bottom:6px}
.addflow .lede{color:var(--text-dim); margin:0 0 16px}
.cat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.cat-btn{min-height:76px; border-radius:18px; background:var(--surface); border:1px solid var(--line); font-weight:700; font-size:19px; display:flex; align-items:center; justify-content:center}
.saved-note{display:flex; align-items:center; gap:10px; color:var(--ok); font-weight:700; margin:4px 0 2px}
/* ============ Settings ============ */
.set-group{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px}
.set-group h3{font-size:18px; margin-bottom:6px}
.set-group p{color:var(--text-dim); font-size:15px; margin:0 0 10px}
.set-group p.plain{color:var(--text)}
.set-group .btn{margin-top:8px}
.rej-row{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--line)}
.rej-row:last-child{border-bottom:none}
.rej-row .txt{flex:1; font-size:15px}
.rej-row .txt small{display:block; color:var(--text-faint); font-size:13px}
.rej-row .btn{width:auto; min-height:44px; padding:8px 14px; font-size:14.5px}
/* ============ Pick my own ============ */
.pick-slot{margin-bottom:18px}
.pick-slot h3{font-size:17px; margin-bottom:8px}
.pick-strip{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none}
.pick-strip::-webkit-scrollbar{display:none}
.pick-cell{flex:none; width:104px; border-radius:14px; overflow:hidden; border:2px solid var(--line); background:var(--surface); padding:0; text-align:left}
.pick-cell img{width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--photo-back)}
.pick-cell .cap{font-size:12px; font-weight:600; padding:6px 8px; line-height:1.25}
.pick-cell[aria-pressed="true"]{border-color:var(--accent)}
.pick-cell.none-cell{display:flex; align-items:center; justify-content:center; min-height:104px; color:var(--text-dim); font-weight:600; font-size:14px}
/* ============ Toast ============ */
.toast{position:fixed; left:16px; right:16px; bottom:calc(104px + env(safe-area-inset-bottom)); max-width:528px; margin:0 auto; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:14px; padding:13px 16px; display:none; align-items:center; gap:12px; z-index:80; box-shadow:var(--shadow)}
.toast.show{display:flex}
.toast .msg{flex:1; font-size:15px; font-weight:600}
.toast button{color:var(--accent); font-weight:700; min-height:44px; padding:4px 8px}
.hidden{display:none !important}
@media (prefers-reduced-motion: reduce){
  .switch::after{transition:none}
  *{animation:none !important; transition:none !important}
}
.deal-anim{animation:settle .28s ease both}
@keyframes settle{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)}}
</style>
</head>
<body>
<header class="app">
  <div class="wordmark">Outfitter<small>Your closet, dealt</small></div>
</header>

<div class="banner" id="storage-banner" role="alert"></div>

<main>
  <!-- ============ TODAY ============ -->
  <section class="view" id="view-today" aria-label="Today"></section>
  <!-- ============ CLOSET ============ -->
  <section class="view" id="view-closet" aria-label="Closet"></section>
  <!-- ============ SETTINGS ============ -->
  <section class="view" id="view-settings" aria-label="Settings"></section>
</main>

<nav class="dock" aria-label="Main">
  <div class="inner">
    <button id="dock-add" class="add" type="button"></button>
    <button id="dock-today" type="button"></button>
    <button id="dock-closet" type="button"></button>
    <button id="dock-settings" type="button"></button>
  </div>
</nav>

<!-- Add flow overlay -->
<div class="addflow" id="addflow" role="dialog" aria-modal="true" aria-label="Add a piece"></div>

<!-- Generic sheet -->
<div class="sheet-wrap" id="sheet-wrap">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status"><span class="msg" id="toast-msg"></span><button id="toast-action" type="button" class="hidden">Undo</button></div>

<input type="file" id="file-photo" accept="image/*" class="hidden" aria-hidden="true" tabindex="-1">
<input type="file" id="file-import" accept=".json,application/json" class="hidden" aria-hidden="true" tabindex="-1">

<script>
'use strict';
/* =====================================================================
   Outfitter — a single-file, on-device outfit dealer.
   No network calls. No accounts. All data lives in IndexedDB on this
   device (with an in-memory fallback if the browser refuses storage).
   ===================================================================== */

/* ---------- Icons (purpose-drawn inline SVG, rounded stroke) ---------- */
const IC = {
  plus: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  shuffle: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h4l10 10h4m0 0-3-3m3 3-3 3M3 17h4l2.5-2.5M13.5 9.5 17 7h4m0 0-3-3m3 3-3 3"/></svg>',
  heart: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C7 16.5 3.5 13.3 3.5 9.6 3.5 7 5.4 5 7.8 5c1.7 0 3.3.9 4.2 2.3C12.9 5.9 14.5 5 16.2 5c2.4 0 4.3 2 4.3 4.6 0 3.7-3.5 6.9-8.5 10.9Z"/></svg>',
  heartFill: '<svg class="ic fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5C7 16.5 3.5 13.3 3.5 9.6 3.5 7 5.4 5 7.8 5c1.7 0 3.3.9 4.2 2.3C12.9 5.9 14.5 5 16.2 5c2.4 0 4.3 2 4.3 4.6 0 3.7-3.5 6.9-8.5 10.9Z"/></svg>',
  x: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>',
  camera: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="14" r="3.4"/></svg>',
  sun: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3 19 19M19 5l-1.7 1.7M6.7 17.3 5 19"/></svg>',
  hanger: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a2.3 2.3 0 1 0-2.3-2.3"/><path d="M12 8.5V11L3.6 17.6a1.5 1.5 0 0 0 .9 2.7h15a1.5 1.5 0 0 0 .9-2.7L12 11"/></svg>',
  sliders: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h6M15 7h4M5 12h2M11 12h8M5 17h10M19 17h0"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></svg>',
  download: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4 19h16"/></svg>',
  upload: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0 4 4m-4-4L8 8M4 19h16"/></svg>',
  eyeOff: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M9.9 5.9A9.8 9.8 0 0 1 12 5.5c5 0 8.5 4.5 9.5 6.5a13.6 13.6 0 0 1-3 3.7M6 8A13.4 13.4 0 0 0 2.5 12C3.5 14 7 18.5 12 18.5c1.2 0 2.3-.2 3.3-.6"/></svg>',
  undo: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6 5 9.5 8.5 13M5 9.5h9a5 5 0 0 1 0 10h-3"/></svg>'
};

/* ---------- Taxonomy (closed enums from the fit-system pass, nothing else) ---------- */
const CATEGORIES = ['top', 'bottom', 'shoes', 'layer'];
const CAT_LABEL = { top: 'Top', bottom: 'Bottoms', shoes: 'Shoes', layer: 'Layer' };
const SLOT_LABEL = { top: 'Top', bottom: 'Bottoms', shoes: 'Shoes', layer: 'Layer' };

const KINDS = {
  top:    [ ['polo','Golf polo'], ['structured','Dress polo'], ['button','Button-down'], ['henley','Henley'], ['tee','Tee'], ['hoodie','Hoodie'] ],
  bottom: [ ['performance-pant','Performance pant'], ['chino','Chino'], ['jean','Jean'], ['jogger','Jogger'], ['short','Short'], ['athletic-short','Gym short'] ],
  shoes:  [ ['wingtip-hybrid','Wingtip hybrid'], ['loafer','Loafer'], ['casual-shoe','Casual leather'], ['boot','Boot'], ['sneaker-clean','Clean sneaker'], ['sneaker-athletic','Trainer'] ],
  layer:  [ ['quarter-zip','Quarter-zip'], ['v-neck','V-neck sweater'], ['vest','Vest'], ['blazer','Blazer'], ['crew','Crew sweater'], ['jacket','Jacket'] ]

    let anyForTriple = false;
    for (const layer of layerOptions) {
      const sel = { top, bottom, shoes, layer };
      if (isBanned(sel, occasion)) continue;
      if (state.rejectedHashes.has(selectionHash(sel))) continue;
      anyForTriple = true;
      count++;
      if (!onlyCombo) onlyCombo = sel;
      if (count >= cap) break outer;
    }
    void anyForTriple;
  }
  return { count, onlyCombo: count === 1 ? onlyCombo : null, capped: count >= cap };
}

/* Full state of an occasion for the UI: what can be dealt, and if not, why. */
function occasionState(state, occasion) {
  const slots = {};
  const missing = [];
  for (const slot of ['top', 'bottom', 'shoes']) {
    slots[slot] = slotCandidates(state.items, occasion, slot);
    if (!slots[slot].length) missing.push(slot);
  }
  const guessedHeld = state.items.filter(it => !it.retired && it.available && it.detailsGuessed && it.occasions.includes(occasion) && matrixAllows(it, occasion)).length;
  if (missing.length) return { kind: 'missing-slots', missing, guessedHeld };
  const { count, onlyCombo } = countCombos(state, occasion, 4);
  if (count === 0) {
    // Distinguish "bans ate everything" from "rejections ate everything":
    const rawCount = countCombosIgnoringRejections(state, occasion);
    if (rawCount > 0) return { kind: 'all-rejected', guessedHeld };
    return { kind: 'no-valid-combo', guessedHeld };
  }
  return { kind: 'ready', comboCount: count, onlyCombo, guessedHeld };
}
function countCombosIgnoringRejections(state, occasion) {
  const saved = state.rejectedHashes;
  state.rejectedHashes = new Set();
  const { count } = countCombos(state, occasion, 4);
  state.rejectedHashes = saved;
  return count;
}

/* Deal an outfit for an occasion, honoring the relaxation order.
   Returns { selection } or { state: occasionState }. */
function dealOutfit(state, occasion) {
  const st = occasionState(state, occasion);
  if (st.kind === 'missing-slots' || st.kind === 'no-valid-combo' || st.kind === 'all-rejected') return { state: st };
  for (let relax = 0; relax <= 3; relax++) {
    const ex = buildExclusions(state, occasion, relax);
    const sel = dealOnce(state, occasion, ex);
    if (sel) return { selection: sel, onlyCombo: st.comboCount === 1 && relax === 0 };
  }
  return { state: { kind: 'all-rejected', guessedHeld: st.guessedHeld } };
}

/* Swap one slot of a dealt selection: ban-checked against the rest,
   does not land on a rejected combination. */
function swapSlot(state, occasion, sel, slot) {
  const options = slotCandidates(state.items, occasion, slot).filter(it => it.id !== sel[slot].id);
  const now = Date.now();
  const viable = options.filter(it => {
    const trial = Object.assign({}, sel, { [slot]: it });
    return !isBanned(trial, occasion) && !state.rejectedHashes.has(selectionHash(trial));
  });
  if (!viable.length) return null;
  const pick = weightedPick(viable, it => pieceWeight(it, state.scores, now));
  return Object.assign({}, sel, { [slot]: pick });
}
</script>

<script>

}

  const s = h('span'); s.innerHTML = iconHTML; b.appendChild(s);

}

/* ---------- Toast with optional Undo ---------- */
let toastTimer = null;
function showToast(msg, actionLabel, actionFn, ms) {

}

/* ---------- Reload state from the stores ---------- */
async function reloadState() {

    if (it) sel[it.category] = it;

}
async function recordDeal(occasion, sel, rating) {

    id: uid(), dealtAt: Date.now(), occasion,

    rating: rating || 'none', ratedAt: rating && rating !== 'none' ? Date.now() : null

  state.deals.push(deal);

}
async function updateDealRating(deal, rating) {

}
/* Wear confirm: the deal's rating and the pieces' wear counters move together. */
store.wearDeal = async function (deal, itemsToUpdate) {

  if (dbMode === 'memory') {
    memStores.deals.set(deal.id, deal);
    for (const it of itemsToUpdate) memStores.items.set(it.id, it);
    return;
  }
  const tx = idb.transaction(['deals', 'items'], 'readwrite');
  tx.objectStore('deals').put(deal);
  for (const it of itemsToUpdate) tx.objectStore('items').put(it);
  await txDone(tx);
  state.scores = deriveScores(state.deals);
  state.rejectedHashes = rejectedComboHashes(state.deals);
};

/* ---------- View switching ---------- */
function showView(name) {
  state.view = name;

}
function render() {
  if (state.view === 'today') renderToday();
  else if (state.view === 'closet') renderCloset();

}

/* ================= TODAY ================= */
function renderToday() {
  const root = document.getElementById('view-today');
  root.replaceChildren();
  if (!state.items.length) { renderEmpty(root); return; }

    const d = h('div', 'done-note');

    d.appendChild(h('p', null, 'That is the whole job done. If plans change, deal something else.'));

  d.appendChild(b);

  root.appendChild(d);
}
function occasionChips(current, onPick) {
  const row = h('div', 'occ-row');
  for (const occ of OCCASIONS) {
    const c = h('button', 'occ', OCC_LABEL[occ]); c.type = 'button';

}
function renderPinned(root) {

  root.appendChild(h('h2', null, when));
  root.appendChild(h('p', 'cap-line', 'You picked this one. It is waiting for you.'));
  root.appendChild(outfitCard(sel, pin.deal, true));
  const actions = h('div', 'morning-actions');
  if (pin.dateStr === todayStr()) {
    actions.appendChild(btn('Wearing it', 'primary', async () => {
      await confirmWorn(pin.deal, sel);
      await store.put('meta', { key: 'today', dealId: null, dateStr: todayStr() });
      state.todayPin = null; state.morningDone = true;
      await reloadState(); state.morningDone = true; renderToday();
    }, IC.check));
  }
  actions.appendChild(btn('Shuffle instead', '', async () => {
    await store.put('meta', { key: 'today', dealId: null, dateStr: todayStr() });
    state.todayPin = null; state.current = null;

  root.appendChild(actions);
}
async function confirmWorn(deal, sel) {
  const now = Date.now();
  const itemsToUpdate = [];
  for (const it of [sel.top, sel.bottom, sel.shoes, sel.layer]) {
    if (!it) continue;
    it.wornCount = (it.wornCount || 0) + 1;
    it.lastWornAt = now;

  await store.wearDeal(deal, itemsToUpdate);

}
function renderDealHome(root) {
  const occ = state.settings.lastOccasion || 'work';
  root.appendChild(occasionChips(occ, async (picked) => {
    state.settings.lastOccasion = picked;
    await store.setMeta('settings', { lastOccasion: picked });
    state.current = null; state.shuffles = 0;
    renderToday();
  }));
  if (!state.current) {
    const res = dealOutfit(state, occ);
    if (res.selection) {
      // Record asynchronously; the card renders from the selection now.
      recordDeal(occ, res.selection).then(deal => {
        state.current = { deal, sel: res.selection, onlyCombo: !!res.onlyCombo };

      root.appendChild(h('p', 'cap-line', 'Dealing…'));
      return;
    }
    root.appendChild(deadEndState(res.state, occ));
    return;
  }
  const { deal, sel } = state.current;
  root.appendChild(outfitCard(sel, deal, false));
  const st = occasionState(state, occ);
  if (st.kind === 'ready' && st.comboCount <= 3 && st.comboCount > 1) {
    const note = h('p', 'cap-line', 'Only ' + st.comboCount + ' fresh ' + OCC_LABEL[occ] + ' combinations remain — bring one back in Settings, or add a piece.');
    note.style.marginTop = '12px';
    root.appendChild(note);
  }
  const actions = h('div', 'morning-actions');
  const row = h('div', 'btn-row');
  row.appendChild(btn('Wear this', 'primary', () => wearCurrent(), IC.check));
  row.appendChild(btn('Shuffle', '', () => shuffleCurrent(), IC.shuffle));
  actions.appendChild(row);
  const pick = h('button', 'link-btn', state.shuffles >= 3 ? 'Want to pick your own today?' : 'Pick my own');
  pick.type = 'button';
  pick.addEventListener('click', () => { state.pickMode = true; state.pickSel = { top: null, bottom: null, shoes: null, layer: null }; renderToday(); });
  actions.appendChild(pick);

}
function deadEndState(st, occ) {
  const d = h('div', 'deal-state');
  const label = OCC_LABEL[occ];
  if (st.kind === 'missing-slots') {
    d.appendChild(h('h2', null, 'Not enough for ' + label + ' yet.'));
    const names = st.missing.map(s => SLOT_LABEL[s].toLowerCase()).join(', ');
    d.appendChild(h('p', null, 'Missing: ' + names + '. Add ' + (st.missing.length > 1 ? 'those pieces' : 'that piece') + ' and ' + label + ' outfits can be dealt.'));
    if (st.guessedHeld > 0) d.appendChild(h('p', null, st.guessedHeld + (st.guessedHeld === 1 ? ' piece has' : ' pieces have') + ' guessed details and can only be dealt for Weekend until you check them in the Closet.'));
    d.appendChild(btn('Add a piece', 'primary', () => startAddFlow(), IC.plus));
  } else if (st.kind === 'no-valid-combo') {
    d.appendChild(h('h2', null, 'These pieces do not combine for ' + label + '.'));

    if (st.guessedHeld > 0) d.appendChild(h('p', null, st.guessedHeld + (st.guessedHeld === 1 ? ' piece has' : ' pieces have') + ' guessed details and sits out of ' + label + ' until checked.'));

    d.appendChild(btn('Open the Closet', 'quiet', () => showView('closet')));
  } else if (st.kind === 'all-rejected') {
    d.appendChild(h('h2', null, 'Every ' + label + ' combination is out.'));
    d.appendChild(h('p', null, 'You have rejected all of them. Bring one back in Settings, or add a piece to make new combinations.'));
    d.appendChild(btn('Bring one back', 'primary', () => showView('settings')));

function outfitCard(sel, deal, pinned) {
  const card = h('div', 'outfit deal-anim');

    const item = sel[slot];

  }

}
async function dealAndShow(occ) {
  const res = dealOutfit(state, occ);

  const deal = await recordDeal(occ, res.selection);
  state.current = { deal, sel: res.selection, onlyCombo: !!res.onlyCombo };
  renderToday();
}
async function shuffleCurrent() {
  const occ = state.settings.lastOccasion;
  if (state.current && state.current.onlyCombo) {
    showToast('This is the only combination your closet makes for ' + OCC_LABEL[occ] + ' right now.');
    return;
  }

}
async function swapCurrent(slot) {
  if (!state.current) return;
  const occ = state.settings.lastOccasion;
  const next = swapSlot(state, occ, state.current.sel, slot);
  if (!next) { showToast('No other ' + SLOT_LABEL[slot].toLowerCase() + ' pairs with this outfit.'); return; }
  const deal = await recordDeal(occ, next);

}
async function rateDeal(deal, rating) {
  const prev = { rating: deal.rating, ratedAt: deal.ratedAt };

async function wearCurrent() {

/* ---------- Image ingest: decode, orient, downscale, encode, hash ---------- */
async function processImage(file, maxDim, quality, ceiling) {
  let bmp = null;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e1) {
    try { bmp = await createImageBitmap(file); } catch (e2) { bmp = null; }
  }
  let srcW, srcH, draw;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  if (bmp) {
    srcW = bmp.width; srcH = bmp.height;
    draw = () => ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
  } else {
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; }).catch(() => { URL.revokeObjectURL(url); throw new Error('decode-failed'); });
    srcW = img.naturalWidth; srcH = img.naturalHeight;
    draw = () => { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); URL.revokeObjectURL(url); };
  }
  const scale = Math.min(1, maxDim / Math.max(srcW, srcH));
  canvas.width = Math.round(srcW * scale);
  canvas.height = Math.round(srcH * scale);
  draw();
  let blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
  if (!blob) throw new Error('encode-failed');
  if (blob.size > ceiling) {
    // One hard-ceiling pass at 1000px / 0.70, then it is a decision, not a loop.
    if (maxDim > 1000) {
      const s2 = Math.min(1, 1000 / Math.max(srcW, srcH));
      canvas.width = Math.round(srcW * s2); canvas.height = Math.round(srcH * s2);
      draw();
      blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.70));
      if (!blob) throw new Error('encode-failed');
    }
    if (blob.size > ceiling) { const err = new Error('too-large'); err.code = 'too-large'; throw err; }
  }
  const buf = await blob.arrayBuffer();
  const hash = await sha256Hex(buf);
  return { blob, w: canvas.width, h: canvas.height, hash, url: URL.createObjectURL(blob) };
}

<script>
/* ================= SETTINGS ================= */

  if (n >= 1000000) return (n / 1000000).toFixed(1) + ' MB';

}

    state.settings.theme = v;
    await store.setMeta('settings', { theme: v });
    try { localStorage.setItem('outfitter-theme', v); } catch (e) {}
    applyTheme(); renderSettings();
  }));
  root.appendChild(tg);
  root.appendChild(h('p', 'cap-line', 'Outfitter · version 1.0 · ' + PRIVACY_SENTENCE));
}
function applyTheme() {
  const t = state.settings.theme;
  const light = t === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', light ? '#f2ecdf' : '#10151d');
}

/* ---------- Export ---------- */
function bytesToBase64(bytes) {
  let bin = '';
  const CHUNK = 32768;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
  }
  return btoa(bin);
}
function base64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 8192) {
    const end = Math.min(i + 8192, bin.length);
    for (let j = i; j < end; j++) out[j] = bin.charCodeAt(j);
  }
  return out;
}
async function exportCloset() {
  try {
    const items = [];
    for (const it of state.items) {
      const buf = await it.photo.arrayBuffer();
      items.push({
        id: it.id, createdAt: it.createdAt, updatedAt: it.updatedAt,
        category: it.category, kind: it.kind, colorFamily: it.colorFamily,
        name: it.name, brand: it.brand, occasions: it.occasions, occasionsEdited: !!it.occasionsEdited,
        detailsGuessed: !!it.detailsGuessed, available: it.available !== false, retired: !!it.retired,
        wornCount: it.wornCount || 0, lastWornAt: it.lastWornAt || null,
        contentHash: it.contentHash || null, photoMime: 'image/jpeg',
        photoBytes: it.photoBytes, photoW: it.photoW, photoH: it.photoH,
        photoBase64: bytesToBase64(new Uint8Array(buf))
      });
    }
    const todayMeta = await store.getMeta('today');
    const data = {
      app: 'outfitter', formatVersion: 1, exportedAt: new Date().toISOString(),
      itemCount: items.length, items,
      deals: state.deals.map(d => ({ id: d.id, dealtAt: d.dealtAt, occasion: d.occasion, itemIds: d.itemIds, comboHash: d.comboHash, rating: d.rating, ratedAt: d.ratedAt })),
      meta: { today: todayMeta && todayMeta.dealId ? { dealId: todayMeta.dealId, dateStr: todayMeta.dateStr } : null }
    };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = h('a'); a.href = url;
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    a.download = 'outfitter-backup-' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + '-' + pad(now.getHours()) + pad(now.getMinutes()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    storageState.lastExportAt = Date.now();
    storageState.itemCountAtLastExport = state.items.length;
    await store.setMeta('storage', { lastExportAt: storageState.lastExportAt, itemCountAtLastExport: storageState.itemCountAtLastExport });
    showToast('Backup downloaded. Keep it somewhere private.');
    if (state.view === 'settings') renderSettings();
  } catch (e) {
    errorSheet('The backup did not finish', 'Something interrupted writing the file.', 'Your closet is unchanged.', [
      { label: 'Try again', cls: 'primary', fn: () => exportCloset() }
    ]);
  }
}

/* ---------- Import ---------- */
document.getElementById('file-import').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let parsed = null;
  try { parsed = JSON.parse(await file.text()); } catch (err) { parsed = null; }
  const fail = (msg) => errorSheet('That file is not a closet backup', msg, 'Nothing was changed.', [
    { label: 'Choose a different file', cls: 'primary', fn: () => document.getElementById('file-import').click() }
  ]);
  if (!parsed || parsed.app !== 'outfitter') { fail('It does not look like an Outfitter backup.'); return; }
  if (parsed.formatVersion !== 1) { fail('It was made by a different version of Outfitter.'); return; }
  if (!Array.isArray(parsed.items) || !Array.isArray(parsed.deals)) { fail('It is missing pieces of the closet.'); return; }
  // Validate everything before any write: one bad record fails the whole import.
  const decodedItems = [];
  for (const raw of parsed.items) {
    try {
      if (!raw.id || !CATEGORIES.includes(raw.category) || !raw.photoBase64) throw new Error('bad-item');
      const bytes = base64ToBytes(raw.photoBase64);
      if (bytes.length !== raw.photoBytes) throw new Error('size-mismatch');
      decodedItems.push({
        id: raw.id, createdAt: raw.createdAt || Date.now(), updatedAt: raw.updatedAt || Date.now(),
        photo: new Blob([bytes], { type: 'image/jpeg' }), photoMime: 'image/jpeg',
        photoBytes: raw.photoBytes, photoW: raw.photoW || 0, photoH: raw.photoH || 0,
        contentHash: raw.contentHash || null, category: raw.category,
        kind: KINDS[raw.category].some(([v]) => v === raw.kind) ? raw.kind : DEFAULTS[raw.category].kind,
        colorFamily: COLOR_META[raw.colorFamily] ? raw.colorFamily : DEFAULTS[raw.category].colorFamily,
        name: typeof raw.name === 'string' ? raw.name : '', brand: typeof raw.brand === 'string' ? raw.brand : '',
        occasions: Array.isArray(raw.occasions) ? raw.occasions.filter(o => OCCASIONS.includes(o)) : defaultOccasions(raw.kind, raw.category),
        occasionsEdited: !!raw.occasionsEdited, detailsGuessed: !!raw.detailsGuessed,
        available: raw.available !== false, retired: !!raw.retired,
        wornCount: raw.wornCount || 0, lastWornAt: raw.lastWornAt || null
      });
    } catch (err) { fail('One piece in the file could not be read, so none of it was imported.'); return; }
  }
  const decodedDeals = [];
  for (const raw of parsed.deals) {
    if (!raw.id || !Array.isArray(raw.itemIds) || !raw.comboHash) { fail('One outfit record in the file could not be read, so none of it was imported.'); return; }
    decodedDeals.push({ id: raw.id, dealtAt: raw.dealtAt || Date.now(), occasion: raw.occasion, itemIds: raw.itemIds, comboHash: raw.comboHash, rating: ['loved', 'rejected', 'worn'].includes(raw.rating) ? raw.rating : 'none', ratedAt: raw.ratedAt || null });
  }
  state.pendingImport = { items: decodedItems, deals: decodedDeals, today: parsed.meta && parsed.meta.today ? parsed.meta.today : null, raw: parsed };
  openSheet(sheet => {
    const ratedCount = decodedDeals.filter(d => d.rating !== 'none').length;
    sheetHead(sheet, 'Restore this closet?', 'This backup has ' + decodedItems.length + (decodedItems.length === 1 ? ' piece' : ' pieces') + ' and ' + ratedCount + (ratedCount === 1 ? ' rated outfit.' : ' rated outfits.'));
    sheet.appendChild(btn('Replace this closet (' + state.items.length + ' pieces now)', 'primary', () => confirmReplaceImport()));
    sheet.appendChild(h('p', 'lede', 'Replace removes what is here now and puts the backup in its place — pieces, ratings, and rejected combinations included.'));
    sheet.appendChild(btn('Merge: add only pieces I do not have', '', () => applyMergeImport()));
    sheet.appendChild(btn('Cancel', 'quiet', () => { state.pendingImport = null; closeSheet(); }));
  });
});
function confirmReplaceImport() {
  const p = state.pendingImport;
  openSheet(sheet => {
    sheetHead(sheet, 'Replace for good?', 'This removes the ' + state.items.length + ' pieces here now and restores the backup\u2019s ' + p.items.length + ' pieces. There is no undo for a replace.');
    sheet.appendChild(btn('Yes, replace my closet', 'danger-outline', async () => {
      closeSheet();
      await applyReplaceImport();
    }));
    sheet.appendChild(btn('Cancel', 'quiet', closeSheet));
  });
}
async function applyReplaceImport() {
  const p = state.pendingImport;
  state.pendingImport = null;
  const storageMeta = await store.getMeta('storage');
  const metaRecords = [];
  if (storageMeta) metaRecords.push(storageMeta);
  const settingsMeta = await store.getMeta('settings');
  if (settingsMeta) metaRecords.push(settingsMeta);
  if (p.today && p.deals.some(d => d.id === p.today.dealId)) metaRecords.push({ key: 'today', dealId: p.today.dealId, dateStr: p.today.dateStr });
  else metaRecords.push({ key: 'today', dealId: null, dateStr: todayStr() });
  try {
    await store.replaceAll({ items: p.items, deals: p.deals, meta: metaRecords });
  } catch (e) {
    errorSheet('The restore did not finish', 'Something interrupted it.', 'Your closet is unchanged.', [{ label: 'OK', cls: 'primary', fn: () => {} }]);
    return;
  }
  for (const id of Array.from(urlRegistry.keys())) releaseURL(id);
  state.current = null; state.morningDone = false;
  await reloadState();
  showToast('Closet restored: ' + p.items.length + ' pieces, ratings included.');
  showView('closet');
}
async function applyMergeImport() {
  const p = state.pendingImport;
  state.pendingImport = null;
  closeSheet();
  const existingIds = new Set(state.items.map(i => i.id));
  const existingHashes = new Set(state.items.map(i => i.contentHash).filter(Boolean));
  const idRemap = new Map();
  const toAdd = [];
  let skipped = 0;
  for (const item of p.items) {
    if (existingIds.has(item.id) || (item.contentHash && existingHashes.has(item.contentHash))) { skipped++; continue; }
    toAdd.push(item);
    existingIds.add(item.id);
    if (item.contentHash) existingHashes.add(item.contentHash);
  }
  // An imported id can collide with a different photo in a later backup version;
  // remap defensively if a to-add id is somehow taken by a skipped duplicate photo mismatch.
  void idRemap;
  const validIds = new Set(state.items.map(i => i.id).concat(toAdd.map(i => i.id)));
  const existingDealKeys = new Set(state.deals.map(d => d.id + '|' + d.comboHash + '|' + d.dealtAt));
  const existingDealIds = new Set(state.deals.map(d => d.id));
  const dealsToAdd = [];
  for (const d of p.deals) {
    if (existingDealIds.has(d.id)) continue;
    if (existingDealKeys.has(d.id + '|' + d.comboHash + '|' + d.dealtAt)) continue;
    if (!d.itemIds.every(id => validIds.has(id))) continue;
    dealsToAdd.push(d);
  }
  await store.putMany('items', toAdd);
  await store.putMany('deals', dealsToAdd);
  await reloadState();
  showToast('Merge done: ' + toAdd.length + (toAdd.length === 1 ? ' piece' : ' pieces') + ' added, ' + skipped + ' already here, ' + dealsToAdd.length + (dealsToAdd.length === 1 ? ' rated outfit' : ' rated outfits') + ' added.');
  showView('closet');
}

/* ================= DOCK + BOOT ================= */
function dockButton(id, icon, label, fn) {
  const b = document.getElementById(id);
  const s = h('span'); s.innerHTML = icon; b.appendChild(s);
  b.appendChild(h('span', null, label));
  b.addEventListener('click', fn);
}
dockButton('dock-add', IC.plus, 'Add a piece', () => startAddFlow());
dockButton('dock-today', IC.sun, 'Today', () => showView('today'));
dockButton('dock-closet', IC.hanger, 'Closet', () => showView('closet'));
dockButton('dock-settings', IC.sliders, 'Settings', () => showView('settings'));

(async function boot() {
  try {
    idb = await idbOpen();
    dbMode = 'idb';
  } catch (e) {
    dbMode = 'memory';
    const banner = document.getElementById('storage-banner');
    const strong = h('strong', null, 'Saving is off. ');
    banner.appendChild(strong);
    banner.appendChild(document.createTextNode('Outfitter can\u2019t save on this device right now \u2014 your closet will be gone when this page closes. '));
    const retry = h('button', 'link-btn', 'Try again');
    retry.type = 'button';
    retry.addEventListener('click', () => location.reload());
    banner.appendChild(retry);
    banner.classList.add('show');
  }
  await reloadState();
  if (dbMode === 'idb') {
    storageState.persisted = await checkPersisted();
  }
  applyTheme();
  showView('today');
})();
</script>
